name: Timeweb cleanup

on:
  workflow_dispatch:
    inputs:
      provision_run_id:
        description: Run ID of the retained Timeweb smoke/debug workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: timeweb-debug-${{ inputs.provision_run_id }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_timeweb_token: ${{ secrets.TF_VAR_TIMEWEB_TOKEN }}
      STATE_KEY: ${{ secrets.TIMEWEB_DEBUG_STATE_KEY }}
      TF_DIR: terraform/timeweb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Timeweb token
        run: |
          test -n "${TF_VAR_timeweb_token}"
          test -n "${STATE_KEY}"

      - name: Download retained Terraform state
        uses: actions/download-artifact@v4
        with:
          name: timeweb-debug-state-${{ inputs.provision_run_id }}
          path: ${{ runner.temp }}/timeweb-debug-state
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provision_run_id }}

      - name: Restore Terraform state
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "${RUNNER_TEMP}/timeweb-debug-state/timeweb-debug-state.enc" \
            -out "${RUNNER_TEMP}/timeweb-debug-state.tar.gz" \
            -pass env:STATE_KEY
          mkdir -p "${RUNNER_TEMP}/restored-debug-state"
          tar -C "${RUNNER_TEMP}/restored-debug-state" \
            -xzf "${RUNNER_TEMP}/timeweb-debug-state.tar.gz"
          install -m 600 "${RUNNER_TEMP}/restored-debug-state/terraform.tfstate" \
            "${TF_DIR}/terraform.tfstate"
          if test -f "${RUNNER_TEMP}/restored-debug-state/debug.auto.tfvars.json"; then
            install -m 600 "${RUNNER_TEMP}/restored-debug-state/debug.auto.tfvars.json" \
              "${TF_DIR}/debug.auto.tfvars.json"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Terraform init
        id: init
        run: terraform -chdir="${TF_DIR}" init

      - name: Terraform destroy
        id: destroy
        run: timeout 35m terraform -chdir="${TF_DIR}" destroy -auto-approve

      - name: Verify empty Terraform state
        id: verify_empty
        if: always() && steps.init.outcome == 'success'
        run: test -z "$(terraform -chdir="${TF_DIR}" state list)"

      - name: Stage retry state when cleanup is incomplete
        if: >-
          always() && steps.init.outcome == 'success' &&
          (steps.destroy.outcome != 'success' || steps.verify_empty.outcome != 'success')
        run: |
          retry_state_dir="${RUNNER_TEMP}/retry-debug-state"
          mkdir -p "${retry_state_dir}"
          install -m 600 "${TF_DIR}/terraform.tfstate" "${retry_state_dir}/terraform.tfstate"
          if test -f "${TF_DIR}/debug.auto.tfvars.json"; then
            install -m 600 "${TF_DIR}/debug.auto.tfvars.json" \
              "${retry_state_dir}/debug.auto.tfvars.json"
          fi
          if test -f "${RUNNER_TEMP}/restored-debug-state/kubeconfig"; then
            install -m 600 "${RUNNER_TEMP}/restored-debug-state/kubeconfig" \
              "${retry_state_dir}/kubeconfig"
          fi
          tar -C "${retry_state_dir}" \
            -czf "${RUNNER_TEMP}/timeweb-debug-state.tar.gz" .
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "${RUNNER_TEMP}/timeweb-debug-state.tar.gz" \
            -out "${RUNNER_TEMP}/timeweb-debug-state.enc" \
            -pass env:STATE_KEY

      - name: Upload retry state when cleanup is incomplete
        if: >-
          always() && steps.init.outcome == 'success' &&
          (steps.destroy.outcome != 'success' || steps.verify_empty.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: timeweb-debug-state-${{ github.run_id }}
          path: ${{ runner.temp }}/timeweb-debug-state.enc
          if-no-files-found: error
          retention-days: 1

      - name: Report cleanup retry
        if: >-
          always() && steps.init.outcome == 'success' &&
          (steps.destroy.outcome != 'success' || steps.verify_empty.outcome != 'success')
        run: |
          {
            echo "## Timeweb cleanup requires retry"
            echo
            echo "- Encrypted recovery artifact: timeweb-debug-state-${GITHUB_RUN_ID}"
            echo "- Retry cleanup with provision_run_id=${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
