name: Timeweb retained debug verify

on:
  workflow_dispatch:
    inputs:
      provision_run_id:
        description: Run ID of the retained Timeweb smoke/debug workflow
        required: true
        type: string
      gitops_revision:
        description: Versioned app-poly-gitops-k8s release to reconcile
        required: true
        type: string
      expected_fastapi_tag:
        description: FastAPI image tag expected after reconciliation
        required: true
        type: string
      expected_crewai_tag:
        description: CrewAI image tag expected after reconciliation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: timeweb-debug-${{ inputs.provision_run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STATE_KEY: ${{ secrets.TIMEWEB_DEBUG_STATE_KEY }}
      GITOPS_REVISION: ${{ inputs.gitops_revision }}
      EXPECTED_FASTAPI_TAG: ${{ inputs.expected_fastapi_tag }}
      EXPECTED_CREWAI_TAG: ${{ inputs.expected_crewai_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require debug state key
        run: |
          test -n "${STATE_KEY}"
          bash scripts/validate-retained-workflow-inputs.sh \
            "${GITOPS_REVISION}" "${EXPECTED_FASTAPI_TAG}" "${EXPECTED_CREWAI_TAG}"

      - name: Download retained debug state
        uses: actions/download-artifact@v4
        with:
          name: timeweb-debug-state-${{ inputs.provision_run_id }}
          path: ${{ runner.temp }}/timeweb-debug-state
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provision_run_id }}

      - name: Restore kubeconfig
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "${RUNNER_TEMP}/timeweb-debug-state/timeweb-debug-state.enc" \
            -out "${RUNNER_TEMP}/timeweb-debug-state.tar.gz" \
            -pass env:STATE_KEY
          mkdir -p "${RUNNER_TEMP}/restored-debug-state"
          tar -C "${RUNNER_TEMP}/restored-debug-state" \
            -xzf "${RUNNER_TEMP}/timeweb-debug-state.tar.gz"
          chmod 600 "${RUNNER_TEMP}/restored-debug-state/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/restored-debug-state/kubeconfig" >> "${GITHUB_ENV}"

      - name: Reconcile requested GitOps release
        run: |
          patch="$(jq -nc --arg revision "${GITOPS_REVISION}" \
            '{spec:{source:{targetRevision:$revision}}}')"
          kubectl -n argocd patch application gitops-smoke-root \
            --type merge \
            --patch "${patch}"
          kubectl -n argocd annotate application gitops-smoke-root \
            argocd.argoproj.io/refresh=hard \
            --overwrite
          bash scripts/wait-for-argocd-application.sh gitops-smoke-root 600 sync-only
          child_revision=""
          for _ in $(seq 1 120); do
            child_revision="$(kubectl -n argocd get application crewai \
              -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
            if test "${child_revision}" = "${GITOPS_REVISION}"; then
              break
            fi
            sleep 5
          done
          test "${child_revision}" = "${GITOPS_REVISION}"
          kubectl -n argocd annotate application crewai \
            argocd.argoproj.io/refresh=hard \
            --overwrite
          bash scripts/wait-for-argocd-application.sh chat-api 900
          bash scripts/wait-for-argocd-application.sh crewai 900
          kubectl -n argocd get applications gitops-smoke-root chat-api crewai

      - name: Verify FastAPI rollout and image
        run: |
          expected_image="ghcr.io/justgithubaccount/app-poly-gitops-fastapi:${EXPECTED_FASTAPI_TAG}"
          image=""
          for _ in $(seq 1 120); do
            image="$(kubectl -n chat-api get deployment chat-api \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            if test "${image}" = "${expected_image}"; then
              break
            fi
            sleep 5
          done
          test "${image}" = "${expected_image}"
          kubectl -n chat-api rollout status deployment/chat-api --timeout=10m
          echo "FastAPI image: ${image}"

      - name: Execute FastAPI application flow
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "${OPENAI_API_KEY}"

          cleanup_fastapi_smoke() {
            exit_code=$?
            trap - EXIT
            if test "${exit_code}" -ne 0; then
              kubectl -n chat-api get job fastapi-runtime-smoke -o wide || true
              kubectl -n chat-api get pods -l job-name=fastapi-runtime-smoke -o wide || true
              kubectl -n chat-api describe job fastapi-runtime-smoke || true
              kubectl -n chat-api describe pods -l job-name=fastapi-runtime-smoke || true
              kubectl -n chat-api logs job/fastapi-runtime-smoke || true
              kubectl -n chat-api logs deployment/chat-api --since=10m --tail=-1 || true
            fi
            kubectl -n chat-api delete job fastapi-runtime-smoke --ignore-not-found --wait=true || true
            kubectl -n chat-api delete configmap fastapi-runtime-smoke --ignore-not-found || true
            kubectl -n chat-api delete secret chat-openrouter --ignore-not-found || true
            kubectl -n chat-api rollout restart deployment/chat-api || true
            kubectl -n chat-api rollout status deployment/chat-api --timeout=10m || true
            exit "${exit_code}"
          }
          trap cleanup_fastapi_smoke EXIT

          printf '%s' "${OPENAI_API_KEY}" | \
            kubectl -n chat-api create secret generic chat-openrouter \
              --from-file=OPENROUTER_API_KEY=/dev/stdin \
              --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n chat-api rollout restart deployment/chat-api
          kubectl -n chat-api rollout status deployment/chat-api --timeout=10m

          kubectl -n chat-api create configmap fastapi-runtime-smoke \
            --from-file=smoke.sh=scripts/fastapi-runtime-smoke.sh \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n chat-api delete job fastapi-runtime-smoke --ignore-not-found --wait=true
          kubectl -n chat-api apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: fastapi-runtime-smoke
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.12.1
                    command: ["/bin/sh", "/smoke/smoke.sh"]
                    args: ["http://chat-api"]
                    volumeMounts:
                      - name: smoke-script
                        mountPath: /smoke
                        readOnly: true
                volumes:
                  - name: smoke-script
                    configMap:
                      name: fastapi-runtime-smoke
          YAML
          job_phase=""
          for _ in $(seq 1 120); do
            succeeded="$(kubectl -n chat-api get job fastapi-runtime-smoke \
              -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
            failed="$(kubectl -n chat-api get job fastapi-runtime-smoke \
              -o jsonpath='{.status.failed}' 2>/dev/null || true)"
            if test "${succeeded}" = "1"; then
              job_phase="Succeeded"
              break
            fi
            if test "${failed}" = "1"; then
              job_phase="Failed"
              break
            fi
            sleep 5
          done
          runtime_output="$(kubectl -n chat-api logs job/fastapi-runtime-smoke)"
          printf '%s\n' "${runtime_output}"
          test "${job_phase}" = "Succeeded"
          fastapi_trace_id="$(printf '%s\n' "${runtime_output}" | \
            sed -n 's/^FASTAPI_TRACE_ID=\([0-9a-fA-F]\{32\}\)$/\1/p' | tail -n 1)"
          test -n "${fastapi_trace_id}"
          echo "FASTAPI_TRACE_ID=${fastapi_trace_id}" >> "${GITHUB_ENV}"

      - name: Verify CrewAI rollout and image
        run: |
          expected_image="ghcr.io/justgithubaccount/app-poly-gitops-crewai:${EXPECTED_CREWAI_TAG}"
          image=""
          for _ in $(seq 1 120); do
            image="$(kubectl -n crewai-system get deployment crewai \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            if test "${image}" = "${expected_image}"; then
              break
            fi
            sleep 5
          done
          test "${image}" = "${expected_image}"
          kubectl -n crewai-system rollout status deployment/crewai --timeout=10m
          echo "CrewAI image: ${image}"
          kubectl -n crewai-system exec deployment/crewai -- /bin/sh -c \
            'KUBECONFIG=/tmp/auto-k8s-pilot-kubeconfig kubectl get pods --all-namespaces --request-timeout=20s'

      - name: Execute CrewAI Kubernetes health flow
        run: |
          kubectl -n crewai-system delete pod crewai-debug-verify --ignore-not-found
          kubectl -n crewai-system run crewai-debug-verify \
            --restart=Never \
            --image=curlimages/curl:8.12.1 \
            -- /bin/sh -c '
              set -eu
              curl_exit=0
              http_code="$(curl --silent --show-error \
                --output /tmp/result.json \
                --write-out "%{http_code}" \
                --max-time 900 \
                -X POST \
                -H "Content-Type: application/json" \
                -d "{\"namespace\":\"crewai-system\"}" \
                http://crewai/run/k8s-healthcheck)" || curl_exit=$?
              cat /tmp/result.json
              test "${curl_exit}" -eq 0
              test "${http_code}" = "200"
              grep -q "\"task\":\"k8s_pods_overview\"" /tmp/result.json
              grep -q "\"task\":\"cluster_summary\"" /tmp/result.json
              ! grep -q "\"output\":\"ERROR" /tmp/result.json
            '
          phase=""
          for _ in $(seq 1 190); do
            phase="$(kubectl -n crewai-system get pod crewai-debug-verify \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${phase}" in
              Succeeded) break ;;
              Failed)
                kubectl -n crewai-system logs pod/crewai-debug-verify || true
                exit 1
                ;;
            esac
            sleep 5
          done
          crewai_output="$(kubectl -n crewai-system logs pod/crewai-debug-verify)"
          printf '%s\n' "${crewai_output}"
          test "${phase}" = "Succeeded"
          crewai_trace_id="$(printf '%s\n' "${crewai_output}" | jq -r '.metadata.trace_id // empty')"
          test -n "${crewai_trace_id}"
          echo "CREWAI_TRACE_ID=${crewai_trace_id}" >> "${GITHUB_ENV}"

      - name: Verify exported traces in Jaeger
        run: |
          kubectl -n observability rollout status deployment/jaeger --timeout=10m
          kubectl -n observability port-forward service/jaeger 16686:16686 \
            >"${RUNNER_TEMP}/jaeger-port-forward.log" 2>&1 &
          port_forward_pid=$!
          cleanup_port_forward() {
            kill "${port_forward_pid}" 2>/dev/null || true
            wait "${port_forward_pid}" 2>/dev/null || true
          }
          trap cleanup_port_forward EXIT
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:16686/api/v3/services >/dev/null; then
              break
            fi
            sleep 1
          done
          bash scripts/verify-jaeger-trace.sh \
            http://127.0.0.1:16686 "${FASTAPI_TRACE_ID}" chat-api
          bash scripts/verify-jaeger-trace.sh \
            http://127.0.0.1:16686 "${CREWAI_TRACE_ID}" auto-k8s-pilot

      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods --all-namespaces -o wide || true
          kubectl -n argocd get applications -o wide || true
          kubectl -n chat-api describe deployment/chat-api || true
          kubectl -n chat-api logs deployment/chat-api --since=30m --tail=-1 || true
          kubectl -n crewai-system describe deployment/crewai || true
          kubectl -n crewai-system logs deployment/crewai --since=30m --tail=-1 || true
          kubectl -n crewai-system logs pod/crewai-debug-verify || true
