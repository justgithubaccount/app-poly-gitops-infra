name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.54.0

      - name: Validate Taskfile
        run: task --list-all --json > /dev/null

      - name: Install offline test dependencies
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install PyYAML==6.0.2

      - name: Test Taskfile and live-smoke contracts
        run: .venv-ci/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.13.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init (no backend)
        run: terraform -chdir=terraform/timeweb init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/timeweb validate

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              truthy:
                check-keys: false
              document-start: disable

      - name: Check shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: './scripts'
          severity: warning
          version: v0.11.0

      - name: Test disposable GitOps workflow
        run: bash tests/test_ephemeral_smoke.sh

      - name: Test Timeweb floating IP cleanup workflow
        run: bash tests/test_timeweb_floating_ip_cleanup.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6
        with:
          working_directory: terraform/timeweb
          version: v1.28.14
          soft_fail: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
