name: Timeweb smoke and debug

on:
  workflow_dispatch:
    inputs:
      keep_cluster:
        description: Keep the cluster and upload temporary state for debugging
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: timeweb-disposable-smoke
  cancel-in-progress: false

jobs:
  provision-test-destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_timeweb_token: ${{ secrets.TF_VAR_TIMEWEB_TOKEN }}
      TF_VAR_cluster_name: gitops-smoke-${{ github.run_id }}
      TF_VAR_max_runtime_minutes: "120"
      TF_VAR_max_cost_rub: "80"
      TF_DIR: terraform/timeweb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Timeweb token
        run: test -n "${TF_VAR_timeweb_token}"

      - name: Require OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "${OPENAI_API_KEY}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Terraform init
        id: init
        run: terraform -chdir="${TF_DIR}" init

      - name: Terraform plan with cost guard
        run: |
          terraform -chdir="${TF_DIR}" plan -out=smoke.tfplan

      - name: Terraform apply
        id: apply
        run: timeout 50m terraform -chdir="${TF_DIR}" apply -auto-approve smoke.tfplan

      - name: Configure kubectl
        if: steps.apply.outcome == 'success'
        run: |
          terraform -chdir="${TF_DIR}" output -raw kubeconfig > "${RUNNER_TEMP}/kubeconfig"
          chmod 600 "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "${GITHUB_ENV}"

      - name: Wait for Kubernetes
        if: steps.apply.outcome == 'success'
        run: bash scripts/wait-for-kubernetes.sh

      - name: Create ephemeral CrewAI LLM secret
        if: steps.apply.outcome == 'success'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          kubectl create namespace crewai-system
          kubectl -n crewai-system create secret generic crewai-llm \
            --from-literal=openai-api-key="${OPENAI_API_KEY}"

      - name: Bootstrap Argo CD
        if: steps.apply.outcome == 'success'
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --version "9.1.6" \
            --values bootstrap/argocd/values.yaml \
            --set-json 'extraObjects=[]' \
            --wait \
            --timeout 15m
          kubectl -n argocd wait --for=condition=Available deployment --all --timeout=10m

      - name: Reconcile application through GitOps
        if: steps.apply.outcome == 'success'
        run: |
          kubectl apply -f bootstrap/argocd/gitops-smoke-root.yaml
          bash scripts/wait-for-argocd-application.sh gitops-smoke-root 600 sync-only
          bash scripts/wait-for-argocd-application.sh chat-api 900
          bash scripts/wait-for-argocd-application.sh crewai 900
          kubectl -n argocd get applications gitops-smoke-root chat-api crewai

      - name: Smoke health endpoint
        if: steps.apply.outcome == 'success'
        run: |
          kubectl -n chat-api create job healthcheck \
            --image=curlimages/curl:8.12.1 \
            -- /bin/sh -c \
            'curl --silent --show-error --fail --retry 30 --retry-delay 2 --retry-connrefused http://chat-api/health'
          timeout 6m kubectl -n chat-api wait --for=condition=complete job/healthcheck --timeout=5m
          kubectl -n chat-api logs job/healthcheck

      - name: Smoke CrewAI runtime and read-only cluster access
        if: steps.apply.outcome == 'success'
        run: |
          kubectl -n crewai-system create job crewai-healthcheck \
            --image=curlimages/curl:8.12.1 \
            -- /bin/sh -c '
              set -eu
              curl --silent --show-error --fail --retry 30 --retry-delay 2 --retry-connrefused http://crewai/health | tee /tmp/health
              grep -q "\"status\":\"ok\"" /tmp/health
              curl --silent --show-error --fail http://crewai/flows | tee /tmp/flows
              grep -q "k8s-healthcheck" /tmp/flows
              curl --silent --show-error --fail http://crewai/agents | tee /tmp/agents
              grep -q "k8s_operator" /tmp/agents
            '
          timeout 6m kubectl -n crewai-system wait \
            --for=condition=complete job/crewai-healthcheck --timeout=5m
          kubectl -n crewai-system logs job/crewai-healthcheck
          kubectl -n crewai-system exec deployment/crewai -- /bin/sh -c \
            'KUBECONFIG=/tmp/auto-k8s-pilot-kubeconfig kubectl get pods --all-namespaces --request-timeout=20s'

      - name: Execute CrewAI Kubernetes health flow
        if: steps.apply.outcome == 'success'
        run: |
          kubectl -n crewai-system delete pod crewai-flowcheck --ignore-not-found
          kubectl -n crewai-system run crewai-flowcheck \
            --restart=Never \
            --image=curlimages/curl:8.12.1 \
            -- /bin/sh -c '
              set -eu
              curl_exit=0
              http_code="$(curl --silent --show-error \
                --output /tmp/result.json \
                --write-out "%{http_code}" \
                --max-time 900 \
                -X POST \
                -H "Content-Type: application/json" \
                -d "{\"namespace\":\"crewai-system\"}" \
                http://crewai/run/k8s-healthcheck)" || curl_exit=$?
              cat /tmp/result.json
              test "${curl_exit}" -eq 0
              test "${http_code}" = "200"
              grep -q "\"task\":\"k8s_pods_overview\"" /tmp/result.json
              grep -q "\"task\":\"cluster_summary\"" /tmp/result.json
              ! grep -q "\"output\":\"ERROR" /tmp/result.json
            '
          phase=""
          for _ in $(seq 1 190); do
            phase="$(kubectl -n crewai-system get pod crewai-flowcheck \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${phase}" in
              Succeeded) break ;;
              Failed)
                kubectl -n crewai-system logs pod/crewai-flowcheck || true
                exit 1
                ;;
            esac
            sleep 5
          done
          kubectl -n crewai-system logs pod/crewai-flowcheck || true
          test "${phase}" = "Succeeded"

      - name: Kubernetes diagnostics
        if: failure() && steps.apply.outcome == 'success'
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods --all-namespaces -o wide || true
          kubectl -n argocd get applications -o wide || true
          kubectl -n argocd get application gitops-smoke-root -o yaml || true
          kubectl -n argocd get application chat-api -o yaml || true
          kubectl -n argocd get application crewai -o yaml || true
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=200 || true
          kubectl -n chat-api describe deployment/chat-api || true
          kubectl -n chat-api logs deployment/chat-api --tail=200 || true
          kubectl -n crewai-system describe deployment/crewai || true
          kubectl -n crewai-system logs deployment/crewai --since=30m --tail=-1 || true
          kubectl -n crewai-system logs pod/crewai-flowcheck || true

      - name: Stage retained debug state
        if: always() && steps.apply.outcome == 'success' && inputs.keep_cluster == true
        env:
          STATE_KEY: ${{ secrets.TIMEWEB_DEBUG_STATE_KEY }}
        run: |
          test -n "${STATE_KEY}"
          debug_state_dir="${RUNNER_TEMP}/timeweb-debug-state"
          mkdir -p "${debug_state_dir}"
          install -m 600 "${TF_DIR}/terraform.tfstate" "${debug_state_dir}/terraform.tfstate"
          install -m 600 "${KUBECONFIG}" "${debug_state_dir}/kubeconfig"
          tar -C "${debug_state_dir}" -czf "${RUNNER_TEMP}/timeweb-debug-state.tar.gz" .
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "${RUNNER_TEMP}/timeweb-debug-state.tar.gz" \
            -out "${RUNNER_TEMP}/timeweb-debug-state.enc" \
            -pass env:STATE_KEY

      - name: Upload retained debug state
        if: always() && steps.apply.outcome == 'success' && inputs.keep_cluster == true
        uses: actions/upload-artifact@v4
        with:
          name: timeweb-debug-state-${{ github.run_id }}
          path: ${{ runner.temp }}/timeweb-debug-state.enc
          if-no-files-found: error
          retention-days: 1

      - name: Report retained cluster
        if: always() && steps.apply.outcome == 'success' && inputs.keep_cluster == true
        run: |
          {
            echo "## Retained Timeweb debug cluster"
            echo
            echo "- Cluster: $(terraform -chdir="${TF_DIR}" output -raw cluster_name)"
            echo "- Cluster ID: $(terraform -chdir="${TF_DIR}" output -raw cluster_id)"
            echo "- Encrypted state artifact: timeweb-debug-state-${GITHUB_RUN_ID} (retained for one day)"
            echo "- Cleanup: run the Timeweb cleanup workflow with provision_run_id=${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Terraform destroy
        if: always() && steps.init.outcome == 'success' && inputs.keep_cluster != true
        run: timeout 35m terraform -chdir="${TF_DIR}" destroy -auto-approve

      - name: Verify empty Terraform state
        if: always() && steps.init.outcome == 'success' && inputs.keep_cluster != true
        run: test -z "$(terraform -chdir="${TF_DIR}" state list)"
