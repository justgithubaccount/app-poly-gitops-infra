name: Timeweb disposable smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/timeweb-ephemeral-smoke

permissions:
  contents: read

concurrency:
  group: timeweb-disposable-smoke
  cancel-in-progress: false

jobs:
  provision-test-destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_timeweb_token: ${{ secrets.TF_VAR_TIMEWEB_TOKEN }}
      TF_VAR_cluster_name: gitops-smoke-${{ github.run_id }}
      TF_VAR_max_runtime_minutes: "120"
      TF_VAR_max_cost_rub: "80"
      TF_DIR: terraform/timeweb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Timeweb token
        run: test -n "${TF_VAR_timeweb_token}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Terraform init
        id: init
        run: terraform -chdir="${TF_DIR}" init

      - name: Terraform plan with cost guard
        run: |
          terraform -chdir="${TF_DIR}" plan -out=smoke.tfplan

      - name: Terraform apply
        id: apply
        run: timeout 50m terraform -chdir="${TF_DIR}" apply -auto-approve smoke.tfplan

      - name: Configure kubectl
        if: steps.apply.outcome == 'success'
        run: |
          terraform -chdir="${TF_DIR}" output -raw kubeconfig > "${RUNNER_TEMP}/kubeconfig"
          chmod 600 "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "${GITHUB_ENV}"

      - name: Wait for Kubernetes
        if: steps.apply.outcome == 'success'
        run: timeout 12m kubectl wait --for=condition=Ready nodes --all --timeout=10m

      - name: Deploy application and smoke health endpoint
        if: steps.apply.outcome == 'success'
        run: |
          kubectl create namespace app-smoke
          kubectl -n app-smoke create deployment chat-api \
            --image=ghcr.io/justgithubaccount/app-poly-gitops-fastapi:1.1.1 \
            --port=8000
          kubectl -n app-smoke set resources deployment/chat-api \
            --requests=cpu=50m,memory=128Mi \
            --limits=cpu=500m,memory=512Mi
          kubectl -n app-smoke set env deployment/chat-api \
            OTEL_TRACES_EXPORTER=none \
            OTEL_LOGS_EXPORTER=none
          kubectl -n app-smoke expose deployment chat-api --port=80 --target-port=8000
          timeout 10m kubectl -n app-smoke rollout status deployment/chat-api --timeout=8m

          kubectl -n app-smoke create job healthcheck \
            --image=curlimages/curl:8.12.1 \
            -- /bin/sh -c \
            'curl --silent --show-error --fail --retry 30 --retry-delay 2 --retry-connrefused http://chat-api/health'
          timeout 6m kubectl -n app-smoke wait --for=condition=complete job/healthcheck --timeout=5m
          kubectl -n app-smoke logs job/healthcheck

      - name: Kubernetes diagnostics
        if: failure() && steps.apply.outcome == 'success'
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods --all-namespaces -o wide || true
          kubectl -n app-smoke describe deployment/chat-api || true
          kubectl -n app-smoke logs deployment/chat-api --tail=200 || true

      - name: Terraform destroy
        if: always() && steps.init.outcome == 'success'
        run: timeout 35m terraform -chdir="${TF_DIR}" destroy -auto-approve

      - name: Verify empty Terraform state
        if: always() && steps.init.outcome == 'success'
        run: test -z "$(terraform -chdir="${TF_DIR}" state list)"
