name: Application live OpenAI smoke (no cloud)

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: Allow at most six short real gpt-4o-mini requests
        type: boolean
        required: true
        default: false
  push:
    branches: [codex/live-application-smoke]
    paths:
      - .github/workflows/application-live-smoke.yaml
      - scripts/live_smoke/**
      - tests/test_application_live_smoke.py

permissions:
  contents: read

concurrency:
  group: application-live-smoke
  cancel-in-progress: false

jobs:
  live:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_live) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAT_BACKEND_REVISION: 6686997d9c4e8d6815886790341d5e185f86bf1a
      CREWAI_REVISION: 0835d3102555e6cef4fb700c56969ecddc6f6ddd
      UI_REVISION: 06575c95fe30eadc85b3441df26792eef8631683
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout FastAPI release
        uses: actions/checkout@v7
        with:
          repository: justgithubaccount/app-poly-gitops-fastapi
          ref: ${{ env.CHAT_BACKEND_REVISION }}
          path: sources/fastapi
          persist-credentials: false
      - name: Checkout CrewAI release
        uses: actions/checkout@v7
        with:
          repository: justgithubaccount/app-poly-gitops-crewai
          ref: ${{ env.CREWAI_REVISION }}
          path: sources/crewai
          persist-credentials: false
      - name: Checkout reviewed UI implementation
        uses: actions/checkout@v7
        with:
          repository: justgithubaccount/app-poly-gitops-ui
          ref: ${{ env.UI_REVISION }}
          path: sources/ui
          persist-credentials: false
      - name: Verify audited source revisions before exposing the key
        run: |
          test "$(git -C sources/fastapi rev-parse HEAD)" = "${CHAT_BACKEND_REVISION}"
          test "$(git -C sources/crewai rev-parse HEAD)" = "${CREWAI_REVISION}"
          test "$(git -C sources/ui rev-parse HEAD)" = "${UI_REVISION}"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: sources/ui/.nvmrc
          cache: npm
          cache-dependency-path: sources/ui/package-lock.json
      - name: Offline budget guard tests
        run: python3 -m unittest discover -s tests -p test_application_live_smoke.py -v
      - name: Install locked service dependencies
        run: |
          uv sync --project sources/fastapi --python 3.12 --locked --dev
          uv sync --project sources/crewai --python 3.12 --locked --dev
      - name: Build UI without provider credentials
        working-directory: sources/ui
        run: |
          npx --yes npm@11.19.1 ci
          npm run check
          npm run build
          npx playwright install --with-deps chromium
      - name: Real application, browser, OpenAI and OTLP verification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          sources/fastapi/.venv/bin/python scripts/live_smoke/runner.py \
            --sources "${GITHUB_WORKSPACE}/sources" \
            --output "${RUNNER_TEMP}/application-live-smoke"
      - name: Upload sanitized result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-live-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/application-live-smoke/summary.json
          if-no-files-found: ignore
          retention-days: 7
