global:
  domain: argocd.syncjob.ru

configs:
  cm:
    admin.enabled: true
    timeout.reconciliation: 30s
    timeout.hard.reconciliation: 0s
    kustomize.buildOptions: --enable-helm

  params:
    server.insecure: "true"

  repositories:
    gitops-k8s:
      url: https://github.com/justgithubaccount/app-poly-gitops-k8s
    gitops-helm:
      url: https://github.com/justgithubaccount/app-poly-gitops-helm

  secret:
    createSecret: true

server:
  ingress:
    enabled: false  # Managed via GitOps in app-poly-gitops-k8s (ingress-argo.yaml)

# Self-managed ArgoCD Application
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: argocd
      namespace: argocd
      labels:
        tier: platform
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        name: in-cluster
        namespace: argocd
      project: default
      sources:
        - chart: argo-cd
          repoURL: https://argoproj.github.io/argo-helm
          targetRevision: "9.1.6"
          helm:
            valueFiles:
              - $values/bootstrap/argocd/values.yaml
        - repoURL: https://github.com/justgithubaccount/app-poly-gitops-infra
          # Keep main until a release newer than v0.1.0 carries an immutable
          # self-reference. v0.1.0 itself points back to main.
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          allowEmpty: true
          selfHeal: true
          prune: true
        syncOptions:
          - Validate=true
          - CreateNamespace=true
          - PruneLast=true
